name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rdai-viewer (macroquad) links X11, GL and ALSA.
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      # Pinned to the local toolchain (docs/agents/toolchain.md).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Release: the behaviour tests run whole laps (docs/agents/testing.md).
      - run: cargo test --workspace --release --no-fail-fast
      - run: scripts/c-smoke.sh
